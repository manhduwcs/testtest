name: CI Pipeline - build image & push to dockerhub

on:
    push:
        branches:
          - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
          - name: Checkout source code
            uses: actions/checkout@v4

          - name: Install dependencies (CI mode)
            run: npm ci

          - name: Execute testing
            run: npm test

          - name: Setup Docker BuildX
            uses: docker/setup-buildx-action@v3

          - name: Login to DockerHub
            uses: docker/login-action@v3
            with:
                 username: ${{ secrets.DOCKERHUB_USERNAME }}
                 password: ${{ secrets.DOCKERHUB_PASSWORD }}

          - name: Build image and push to hub
            uses: docker/build-push-action@v6
            with:
                context: .
                file: ./Dockerfile
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME}}/backend-test:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha, mode=max

          - name: Checkout & clone Ops repo
            uses: actions/checkout@v4
            with:
                repository: ${{ github.repository_owner }}/ops_test
                token: ${{ secrets.PAT_TOKEN }}
                path: ops-files

          - name: Update image tag via kubectl kustomize
            run: |
                cd ops-files
                kubectl kustomize edit set image ${{ secrets.DOCKERHUB_USERNAME }}/backend-test=${{ secrets.DOCKERHUB_USERNAME }}/backend-test:{{ github.sha }}

          - name: Push change in ops repo to remote
            uses: stefanzweifel/git-auto-commit-action@v5
            with:
                repository: ops-files
                commit_messages: "[CI] chore: update image tag to ${{ github.sha }}"
