version: "3.8"

services:
    web-gateway:
        image: nginx:alpine
        container_name: web-gateway
        network_mode: host
        restart: always
        volumes:
            - ./gateway/nginx.conf:/etc/nginx/conf.d/00-default.conf:ro
            - ./frontend/index.html:/var/www/frontend/index.html:ro

    database:
        image: mysql:8.0
        container_name: database-mysql
        network_mode: host
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: A@123456
            MYSQL_DATABASE: db_test
        volumes:
            - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
            - mysql_lab_data:/var/lib/mysql

volumes:
    mysql_lab_data:
        driver: local
